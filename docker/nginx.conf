server {
    listen 5700;
    server_name _;

    root /app/web;
    index index.html;

    # 自动补斜杠等重定向只回相对路径（Location: /api/），不拼 Host 与容器内监听端口 5700。
    # 不关的话，经反代访问 /api 会被 301 到 http://域名:5700/api/，既跳错地址又暴露内部端口。
    absolute_redirect off;

    gzip on;
    # "font/ttf" 是给 Monaco 的图标字体 codicon-<hash>.ttf 加的：ttf 是未压缩的 sfnt 容器，
    # gzip 能把它从约 137 KiB 压到约 67 KiB，是这份产物里少数还压得动的二进制。
    # 反过来 woff2 刻意不列进来：它自带 Brotli 压缩，再 gzip 一遍纯属白烧 CPU，
    # 理由和下面那条「别加 image/webp」完全一样。
    # 注意：这条能不能命中取决于基础镜像的 mime.types 有没有把 .ttf 映射成 font/ttf。
    # 没映射上时的表现同样是【静默不压缩】而非报错，排查时先看响应头的 Content-Type，
    # 按实际值补一条即可，不要以为 gzip 开了就一定生效。
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/ttf;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 512m;

    # 禁止搜索引擎收录，防止面板地址被公开索引
    # 注意 nginx 的继承规则：某个 location 里只要写了任意一条 add_header，就【完全不再继承】这里的
    # add_header。所以下面 index.html 与两条静态资源缓存规则都把这一行原样又抄了一遍；
    # 漏抄不会报错，只是那部分响应静默丢掉这个头。
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 入口 index.html：可以缓存，但每次都必须回源校验（ETag / Last-Modified 没变就是 304，开销很小）。
    # 不写的话浏览器会按启发式规则把旧 index.html 当新鲜内容用上一段时间：升级后继续跑旧前端、
    # 去请求已经被删掉的旧 hash 资源，表现为界面错乱、编辑器加载失败（#126）。
    # 访问 /（index 指令）和 SPA 深链（/scripts、/tasks …，即下面 try_files 的最后一项）都会
    # 内部跳转到 /index.html，所以只写这一个精确匹配就能全部覆盖。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 任务日志、订阅拉取等用 SSE 推送，需要长连接 + 不缓冲。
    # 单独放在 /api/ 之前，专门拉高 read_timeout、关闭 chunked buffering。
    location ~* ^/api/.*/stream$ {
        proxy_pass http://127.0.0.1:5701;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # API 路由必须优先于后面的静态资源正则，否则 /api/.../*.jpg 会被当成前端静态文件直接 404。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5701/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ---- 静态资源缓存头（#126）----
    # 与 Go 内嵌托管（server/static_frontend.go，二进制 / Windows / Magisk 部署用）同一套口径：
    #   index.html → no-cache（见上面的 location = /index.html）；
    #   /assets 下带 Vite 内容哈希的文件 → 一年 + immutable；
    #   其余静态文件（不带哈希）→ no-cache。
    # 以前这里对所有 js/css/字体一律 30d + immutable，不带哈希的 /assets/optimization.css、
    # /fonts/fonts.css 升级后同名换了内容，浏览器却可能一个月都不回源。
    #
    # 下面两条都是正则 location，按书写顺序匹配、先中先用，所以「带哈希」必须写在「其余」前面。
    # 两条都没有 try_files：文件不存在就是 nginx 的 404，不会回退成 index.html
    # （缓存里的旧前端来要已被删掉的旧 hash 文件时，拿到的是明确的 404 而不是一段 HTML）。
    # Cache-Control 故意都不加 always：add_header 默认不作用于 404 等错误响应，
    # 缺失文件的 404 绝不能被标成 immutable。
    # 扩展名清单要跟着产物一起维护：漏掉的扩展名不会 404（上面 location / 的 try_files 照样命中文件），
    # 只是静默地拿不到这里的缓存头，只能靠盯响应头发现。
    # 注意别往上面的 gzip_types 加 image/webp：webp 本身已压缩，再 gzip 纯属白烧 CPU。

    # 带 Vite 内容哈希的产物：内容一变文件名必然跟着变，可以放心长缓存。
    # 形态是 <name>-<8 位 base64url 哈希>.<ext>，例如 index-CZqAZ7Ga.js、ansi--b05i_G0.js、
    # ExecutionTrendChart-CunqJMw-.js、codicon-Brq4_Ui5.ttf。两个 (?=…) 用来排除「长得像单词或日期」的
    # 8 位片段（my-reallong.css、user-Settings.css、backup-20260915.css）：至少要有一个字母，并且至少有
    # 一个数字 / _ / -，或者首字符以外的大写字母。
    # 这条规则与 server/static_frontend.go 的 isViteHashedAssetName 逐条对应，改一边必须同步改另一边
    # （server/static_frontend_test.go 会逐字比对这一行）。
    # 正则里有 { }，nginx 要求整条加引号；用区分大小写的 ~ 而不是 ~*，否则 [A-Z] 会连小写一起匹配。
    location ~ "^/assets/(?:[^/]+/)*[^/]+-(?=[A-Za-z0-9_-]{0,7}[A-Za-z])(?=[A-Za-z0-9_-]{0,7}[0-9_-]|[A-Za-z0-9_-]{1,7}[A-Z])[A-Za-z0-9_-]{8}\.(?:(?:js|mjs|css)(?:\.map)?|json|wasm|svg|png|jpe?g|gif|webp|avif|ico|ttf|otf|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # 其余静态文件（不带哈希）：/assets/optimization.css、/fonts/*、/favicon-512.webp 等。
    # 升级后会同名换内容，只能 no-cache：可以存，但每次都要带 ETag / Last-Modified 回源校验（没变就是 304）。
    location ~* \.(js|mjs|css|map|json|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|otf|wasm)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
